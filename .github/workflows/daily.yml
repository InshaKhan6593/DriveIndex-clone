# DAILY PIPELINE — recent source updates, then ingest -> compute -> publish.
#
# WHY HERE AND NOT ON RENDER: Render's free tier has no cron jobs and no persistent disks, so it
# cannot run this, and could not keep the 294MB working database between runs if it could.
# GitHub Actions minutes are free and unlimited for PUBLIC repositories, which this one is.
# If this repo is ever made private, this starts consuming the 2,000 min/month quota and a daily
# run exceeds it in about a week — make the schedule weekly, or move the cron to a local machine.
#
# WHY A MATRIX RATHER THAN ONE LONG JOB: GitHub kills a job at 6 hours, and the full pipeline
# budgets 505 minutes — one job cannot hold it. But the scrapers are independent: each writes its
# own harvest file and its own resume marker, and only ingest touches the database. So they run in
# PARALLEL, one runner each, and every source gets its own 6-hour budget instead of a slice of a
# shared one. The `build` job then serialises what has to be serial.
#
# STATE: runners are ephemeral, so the working database, the resume markers, and the two harvest
# files that crawlers actually read back are carried between runs as Release assets on the `state`
# tag. Gzip does the heavy lifting — the database is 294MB raw / 77MB gzipped, and BaT's harvest
# is 190MB raw / 16MB gzipped. Read DEPLOY.md before running any writing job locally, or the
# local and cloud copies diverge silently.
name: daily

on:
  schedule:
    # GitHub supports an IANA timezone here: run at 04:00 US Eastern local time, including DST.
    # The schedule is deliberately recent-mode; a historical backfill must be requested manually.
    - cron: "0 4 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to scrape: 'all', 'none', or a comma list such as hagerty,bj,bat"
        required: false
        default: "none"
      mode:
        description: "recent refreshes current windows; full continues historical backfills"
        required: false
        type: choice
        options:
          - recent
          - full
        default: recent
      recent_days:
        description: "Days to re-check late-posted recent auction results"
        required: false
        default: "90"
      deadline_minutes:
        description: "Per-source: stop starting new work after this many minutes"
        required: false
        default: "240"

# A run takes hours. Two overlapping runs would fight over the same state release and the loser's
# work would be silently discarded, so a late-starting run waits rather than racing.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write # required to upload the snapshot and state release assets

jobs:
  # ── WHICH SOURCES TO RUN ──────────────────────────────────────────────────────────────────
  # Turns the `sources` input into a matrix. Kept in one place so the scrape job below stays a
  # plain matrix and the selection logic is readable and testable on its own.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          SOURCES: ${{ github.event.inputs.sources || 'all' }}
        run: node .github/scripts/plan-sources.js >> "$GITHUB_OUTPUT"

  # ── SCRAPE — one runner per source, all in parallel ───────────────────────────────────────
  scrape:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false # one auction site being down must not cancel the other sources
      max-parallel: 6 # polite: do not open ten scrapers at once from one IP range
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm

      # Only browser-backed sources install Chromium. Installing it for the other sources would
      # cost a few minutes per runner for nothing.
      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ "${{ matrix.source }}" = "cab" ] || [ "${{ matrix.source }}" = "mecum" ] || [ "${{ matrix.source }}" = "bj" ] || [ "${{ matrix.source }}" = "hagerty" ]; then
            npm ci
            npx playwright install --with-deps chromium
          else
            npm ci --omit=dev
          fi

      # Ten seconds here against an hour of wasted runner time. A CLI entry point that does not
      # parse is only discovered when its stage starts, which for db/export-serving.js meant after
      # a 73MB restore, a full ingest and a 71k-car recompute. No test loads those files, so the
      # suite cannot catch it; this can.
      - name: Check every file parses
        run: node validation/syntax-check.js

      - name: Initialize run manifest
        env:
          RUN_SOURCES: ${{ github.event.inputs.sources || 'all' }}
          RUN_MODE: ${{ github.event.inputs.mode || 'recent' }}
          RUN_RECENT_DAYS: ${{ github.event.inputs.recent_days || '90' }}
        run: |
          set -euo pipefail
          {
            echo "workflow=daily"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "sources=${RUN_SOURCES}"
            echo "mode=${RUN_MODE}"
            echo "recent_days=${RUN_RECENT_DAYS}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > /tmp/pipeline-run-manifest.txt

      - name: Restore resume markers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data samples/scraped samples/listings samples/staging
          # Resume markers are what stop a crawler re-walking from the start. Small (~350KB).
          if gh release download state --pattern 'crawler-state.tar.gz' --dir /tmp 2>/dev/null; then
            tar -xzf /tmp/crawler-state.tar.gz
            echo "resume markers restored"
          else
            echo "::warning::No crawler-state.tar.gz yet — this source will walk from the start."
          fi
          # A lock restored from another machine names a PID that means nothing on this runner.
          rm -f data/cron.lock data/bat-detail.lock

      # Three crawlers READ their own harvest file back, and for different reasons:
      #   cab  decides when to stop by looking for records it already has ("8 batches with
      #        nothing new"). Without the file everything looks new and it walks all 40k lots.
      #   bat  is where bat-detail writes its enrichment — it rewrites that file in place.
      #   bj/hagerty keep their complete source harvest available for idempotent re-runs and
      #        dedicated push/manual source workflow runs.
      # Every other crawler resumes purely from its state marker and simply writes a delta, which
      # ingest folds in idempotently on (source, source_lot_id).
      - name: Restore harvest file
        if: matrix.source == 'cab' || matrix.source == 'bat' || matrix.source == 'bj'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ matrix.source }}" in
            cab) ASSET=cars-and-bids.json.gz; DEST=samples/scraped/cars-and-bids.json ;;
            bat) ASSET=bat-partitioned.json.gz; DEST=samples/scraped/bat-partitioned.json ;;
            bj) ASSET=barrettjackson.json.gz; DEST=samples/scraped/barrettjackson.json ;;
          esac
          if gh release download state --pattern "$ASSET" --dir /tmp 2>/dev/null; then
            gunzip -c "/tmp/$ASSET" > "$DEST"
            node -e "console.log('restored', require('./$DEST').length, 'records')"
          else
            echo "::warning::$ASSET missing — ${{ matrix.source }} starts from an empty harvest."
          fi

      - name: Restore Hagerty harvest files
        if: matrix.source == 'hagerty'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p samples/scraped samples/listings
          for SPEC in "hagerty.json.gz|samples/scraped/hagerty.json" "hagerty-listings.json.gz|samples/listings/hagerty-listings.json"; do
            ASSET="${SPEC%%|*}"
            DEST="${SPEC#*|}"
            if gh release download state --pattern "$ASSET" --dir /tmp 2>/dev/null; then
              gunzip -c "/tmp/$ASSET" > "$DEST"
              node -e "console.log('restored', require('./$DEST').length, 'records from $ASSET')"
            else
              echo "::warning::$ASSET missing — Hagerty starts that dataset empty."
            fi
          done

      - name: Check Barrett-Jackson access path
        if: matrix.source == 'bj'
        env:
          CRAWLER_PROXY_URL: ${{ secrets.BJ_PROXY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRAWLER_PROXY_URL:-}" ]; then
            echo "::error::Barrett-Jackson requires the authorized proxy/VPN path."
            echo "::error::Set repository secret BJ_PROXY_URL, or use a self-hosted runner with equivalent access."
            exit 1
          fi

      - name: Check Hagerty access path
        if: matrix.source == 'hagerty'
        env:
          HAGERTY_PROXY_URL: ${{ secrets.HAGERTY_PROXY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HAGERTY_PROXY_URL:-}" ]; then
            echo "::error::Hagerty requires the authorized proxy/VPN path."
            echo "::error::Set repository secret HAGERTY_PROXY_URL, or use a self-hosted runner with equivalent access."
            exit 1
          fi

      - name: Scrape
        env:
          DELAY_MS: "2500"
          SCRAPE_MODE: ${{ github.event.inputs.mode || 'recent' }}
          SCRAPE_RECENT_DAYS: ${{ github.event.inputs.recent_days || '90' }}
          BJ_PROXY_URL: ${{ secrets.BJ_PROXY_URL }}
          HAGERTY_PROXY_URL: ${{ secrets.HAGERTY_PROXY_URL }}
          BJ_EVENT_SLUGS: ${{ vars.BJ_EVENT_SLUGS }}
        run: |
          set -uo pipefail
          case "${{ matrix.source }}" in
            bj) export CRAWLER_PROXY_URL="${BJ_PROXY_URL:-}" ;;
            hagerty) export CRAWLER_PROXY_URL="${HAGERTY_PROXY_URL:-}" ;;
            *) unset CRAWLER_PROXY_URL ;;
          esac
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DEADLINE="${{ github.event.inputs.deadline_minutes || '240' }}"
          # BaT runs its detail-page enrichment straight after the list walk, in the same job:
          # both read and rewrite bat-partitioned.json, so they must never run concurrently.
          if [ "${{ matrix.source }}" = "bat" ]; then
            ONLY="scrape:bat,scrape:bat-detail"
          else
            ONLY="scrape:${{ matrix.source }}"
          fi
          # GitHub starts bash with -e. Disable it around this pipeline so cron.js exit 1 can be
          # classified as PARTIAL below instead of aborting before PIPESTATUS is captured.
          set +e
          node jobs/cron.js --only="$ONLY" --deadline-minutes="$DEADLINE" 2>&1 | tee /tmp/scrape.log
          code=${PIPESTATUS[0]}
          set -e
          FINISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "source=${{ matrix.source }}"
            echo "stages=$ONLY"
            echo "mode=${{ github.event.inputs.mode || 'recent' }}"
            echo "recent_days=${{ github.event.inputs.recent_days || '90' }}"
            echo "started_at=$STARTED_AT"
            echo "finished_at=$FINISHED_AT"
            echo "exit_code=$code"
          } > /tmp/scrape-result.txt
          # cron.js: 0 clean, 1 an optional source failed, 2 the pipeline itself failed. A source
          # being unreachable is a normal day, so only 2 fails this job.
          if [ "$code" -ge 2 ]; then exit 1; fi
          exit 0

      - name: Write scraper diagnostics
        if: always()
        run: |
          set +e
          node .github/scripts/summarise-harvest.js > /tmp/harvest-summary.log 2>&1
          {
            echo "## Scraper diagnostics — ${{ matrix.source }}"
            cat /tmp/scrape-result.txt 2>/dev/null || true
            echo
            echo "### Harvest summary"
            cat /tmp/harvest-summary.log 2>/dev/null || true
            echo
            echo "### Last 80 log lines"
            tail -n 80 /tmp/scrape.log 2>/dev/null || true
          } | tee /tmp/scrape-diagnostics.log >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Hagerty dataset format
        if: always() && matrix.source == 'hagerty'
        run: node validation/hagerty-format.js

      - name: Stage updated source state
        if: always()
        run: |
          set -euo pipefail
          mkdir -p samples/staging/state
          find samples/staging/state -maxdepth 1 -type f -name '*.state.json' -delete
          case "${{ matrix.source }}" in
            bat) STATE_FILES=(samples/scraped/bat-partitioned.state.json samples/scraped/bat-detail.state.json) ;;
            mecum) STATE_FILES=(samples/mecum.state.json) ;;
            rms) STATE_FILES=(samples/rms.state.json) ;;
            good) STATE_FILES=(samples/gooding.state.json) ;;
            broadarrow) STATE_FILES=(samples/broadarrow.state.json) ;;
            dupont) STATE_FILES=(samples/dupont.state.json) ;;
            bonhams) STATE_FILES=(samples/bonhams.state.json) ;;
            bj) STATE_FILES=(samples/barrettjackson.state.json) ;;
            hagerty) STATE_FILES=(samples/hagerty.state.json) ;;
            classic) STATE_FILES=(samples/classic.state.json) ;;
            *) STATE_FILES=() ;;
          esac
          for state_file in "${STATE_FILES[@]}"; do
            if [ -f "$state_file" ]; then
              cp "$state_file" "samples/staging/state/$(basename "$state_file")"
              echo "staged $(basename "$state_file")"
            fi
          done

      # Everything this source produced, handed to the build job. Harvest files are deltas for
      # most sources and the full file for bat/cab; state markers are staged per source so the
      # build can merge them without one matrix job overwriting another.
      - name: Upload harvest and markers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-${{ matrix.source }}
          path: |
            samples/scraped/*.json
            samples/listings/*.json
            samples/staging/state/*.state.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload scraper diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-diagnostics-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/scrape.log
            /tmp/scrape-result.txt
            /tmp/scrape-diagnostics.log
            /tmp/harvest-summary.log
            data/cron-history.jsonl
            samples/**/*.state.json
          if-no-files-found: ignore
          retention-days: 30

  # ── BUILD — ingest, recompute, publish. Serial by nature: one database. ───────────────────
  build:
    needs: [plan, scrape]
    # always() so a dead auction site does not stop the day's recompute and publish. Without it,
    # one failed scrape would mean no snapshot at all.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      # Ten seconds here against an hour of wasted runner time. A CLI entry point that does not
      # parse is only discovered when its stage starts, which for db/export-serving.js meant after
      # a 73MB restore, a full ingest and a 71k-car recompute. No test loads those files, so the
      # suite cannot catch it; this can.
      - name: Check every file parses
        run: node validation/syntax-check.js

      - name: Restore working database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data samples/scraped samples/listings samples/staging
          if ! gh release download state --pattern 'driveindex.sqlite.gz' --dir /tmp 2>/dev/null; then
            echo "::error::No 'state' release found. This workflow CONTINUES an existing corpus"
            echo "::error::(262k+ sales). It must never start from an empty database - that would"
            echo "::error::re-scrape everything from zero and lose all resolved history."
            echo "::error::Seed it once: see DEPLOY.md -> Seeding the state release"
            exit 1
          fi
          gunzip -c /tmp/driveindex.sqlite.gz > data/driveindex.sqlite
          gh release download state --pattern 'crawler-state.tar.gz' --dir /tmp 2>/dev/null && tar -xzf /tmp/crawler-state.tar.gz || true
          rm -f data/cron.lock data/bat-detail.lock
          node -e "const{DatabaseSync}=require('node:sqlite');const d=new DatabaseSync('data/driveindex.sqlite',{readOnly:true});console.log('restored:',d.prepare('SELECT COUNT(*) n FROM sale').get().n,'sales,',d.prepare('SELECT COUNT(*) n FROM car').get().n,'cars')"

      # merge-multiple: every source's artifact unpacks into the same samples/ tree. Filenames are
      # per-source so they cannot collide.
      - name: Collect every source's harvest
        uses: actions/download-artifact@v4
        with:
          pattern: harvest-*
          merge-multiple: true
          path: samples
        continue-on-error: true

      - name: Show what arrived
        run: |
          {
            echo "## Harvests received by build"
            ls -la samples/scraped/ samples/listings/ 2>/dev/null || true
            node .github/scripts/summarise-harvest.js || true
          } | tee /tmp/harvest-summary.log >> "$GITHUB_STEP_SUMMARY"

      - name: Merge updated scraper state markers
        run: |
          set -euo pipefail
          mkdir -p samples/scraped
          shopt -s nullglob
          for state_file in samples/staging/state/*.state.json; do
            name="$(basename "$state_file")"
            case "$name" in
              bat-partitioned.state.json|bat-detail.state.json) destination="samples/scraped/$name" ;;
              *) destination="samples/$name" ;;
            esac
            cp "$state_file" "$destination"
            echo "merged $name -> $destination"
          done

      - name: Ingest and recompute
        run: |
          set -uo pipefail
          set +e
          node jobs/cron.js --only=fx,ingest,ingest:listings,compute 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          set -e
          # Here a failure IS fatal: ingest and compute are required stages, and publishing a
          # half-built catalogue is worse than publishing nothing.
          if [ "$code" -ge 2 ]; then exit 1; fi

      - name: Export the serving snapshot
        run: |
          set -euo pipefail
          node db/export-serving.js
          ls -la data/serving.sqlite
          node -e "const{DatabaseSync}=require('node:sqlite');const d=new DatabaseSync('data/serving.sqlite',{readOnly:true});const c=d.prepare('SELECT COUNT(*) n FROM car').get().n;if(!c)throw new Error('snapshot has 0 cars - refusing to publish');console.log('snapshot ok:',c,'cars')"

      # Immutable per-run backup. This is uploaded before Turso/release publication so a later
      # publish failure still leaves a complete rollback point for this successful build.
      - name: Prepare immutable rollback snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_SOURCES: ${{ github.event.inputs.sources || 'all' }}
          SNAPSHOT_MODE: ${{ github.event.inputs.mode || 'recent' }}
          SNAPSHOT_RECENT_DAYS: ${{ github.event.inputs.recent_days || '90' }}
        run: |
          set -euo pipefail
          SNAPSHOT_DIR="/tmp/pipeline-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export SNAPSHOT_DIR
          rm -rf "$SNAPSHOT_DIR"
          mkdir -p "$SNAPSHOT_DIR"
          gzip -c data/driveindex.sqlite > "$SNAPSHOT_DIR/driveindex.sqlite.gz"
          gzip -c data/serving.sqlite > "$SNAPSHOT_DIR/serving.sqlite.gz"
          tar -czf "$SNAPSHOT_DIR/crawler-state.tar.gz" $(find samples -name '*.state.json') data/fx-rates.json
          [ -f samples/scraped/bat-partitioned.json ] && gzip -c samples/scraped/bat-partitioned.json > "$SNAPSHOT_DIR/bat-partitioned.json.gz" || true
          [ -f samples/scraped/cars-and-bids.json ] && gzip -c samples/scraped/cars-and-bids.json > "$SNAPSHOT_DIR/cars-and-bids.json.gz" || true
          [ -f samples/scraped/barrettjackson.json ] && gzip -c samples/scraped/barrettjackson.json > "$SNAPSHOT_DIR/barrettjackson.json.gz" || true
          [ -f samples/scraped/hagerty.json ] && gzip -c samples/scraped/hagerty.json > "$SNAPSHOT_DIR/hagerty.json.gz" || true
          [ -f samples/listings/hagerty-listings.json ] && gzip -c samples/listings/hagerty-listings.json > "$SNAPSHOT_DIR/hagerty-listings.json.gz" || true
          # If this source was not selected today, the build may not have unpacked its harvest
          # file. Carry forward the rolling copy so the immutable snapshot can restore state
          # exactly instead of falling back to a stale release asset after rollback.
          for ASSET in bat-partitioned.json.gz cars-and-bids.json.gz barrettjackson.json.gz hagerty.json.gz hagerty-listings.json.gz; do
            if [ ! -f "$SNAPSHOT_DIR/$ASSET" ] && gh release download state --pattern "$ASSET" --dir "$SNAPSHOT_DIR" 2>/dev/null; then
              echo "carried forward $ASSET from the state release"
            fi
          done
          node -e "const fs=require('fs');const{DatabaseSync}=require('node:sqlite');const db=new DatabaseSync('data/driveindex.sqlite',{readOnly:true});const serving=new DatabaseSync('data/serving.sqlite',{readOnly:true});const get=(d,q)=>d.prepare(q).get().n;const m={snapshot_id:process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT,workflow:'daily',run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,sha:process.env.GITHUB_SHA,ref:process.env.GITHUB_REF,event:process.env.GITHUB_EVENT_NAME,sources:process.env.SNAPSHOT_SOURCES,mode:process.env.SNAPSHOT_MODE,recent_days:process.env.SNAPSHOT_RECENT_DAYS,created_at:new Date().toISOString(),sale_count:get(db,'SELECT COUNT(*) n FROM sale'),car_count:get(db,'SELECT COUNT(*) n FROM car'),serving_car_count:get(serving,'SELECT COUNT(*) n FROM car')};fs.writeFileSync(process.env.SNAPSHOT_DIR+'/manifest.json',JSON.stringify(m,null,2));"
          (cd "$SNAPSHOT_DIR" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | xargs -0 sha256sum > SHA256SUMS)
          ls -lh "$SNAPSHOT_DIR"

      - name: Store immutable rollback snapshot
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pipeline-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      # The PREVIOUS snapshot is what the Turso load diffs against, and it is already published
      # as data-latest — so it costs nothing extra to store. It must be fetched BEFORE the new one
      # replaces it, which is why this sits above the publish step rather than below it.
      - name: Fetch the previously published snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release download data-latest --pattern 'serving.sqlite' --dir /tmp/prev 2>/dev/null; then
            mv /tmp/prev/serving.sqlite data/serving-prev.sqlite
            ls -la data/serving-prev.sqlite
          else
            echo "no previous snapshot published yet - the Turso load will push everything once"
          fi

      # Turso holds the data the API reads. Only the DIFF is pushed: the free tier allows 10M row
      # writes a month and the snapshot is 361k rows, so a full daily reload would be 10.8M -
      # over the cap on day one. See db/load-turso.js for the arithmetic.
      # The guard is in the script, not in `if:`. A step's own `env:` block is NOT visible to its
      # `if:` expression — that is evaluated first — so `if: env.TURSO_DATABASE_URL != ''` would
      # have been false every time and this step would have silently never run.
      - name: Load the data into Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TURSO_DATABASE_URL:-}" ]; then
            echo "::warning::TURSO_DATABASE_URL is not set - skipping the load. The snapshot is"
            echo "::warning::published, but the live API will keep serving whatever it has."
            exit 0
          fi
          PREV=""
          [ -f data/serving-prev.sqlite ] && PREV="data/serving-prev.sqlite"
          node db/load-turso.js data/serving.sqlite $PREV

      # Fixed tag on purpose: the asset URL never changes. The snapshot is still published even
      # though the API reads Turso - it is the rollback point, and it is what the NEXT run diffs
      # against. --clobber replaces the file in place.
      - name: Publish the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view data-latest >/dev/null 2>&1 || \
            gh release create data-latest --title "Serving snapshot (rolling)" \
              --notes "Read-only snapshot served by the API. Replaced in place by the daily workflow; not a version history."
          gh release upload data-latest data/serving.sqlite --clobber

      - name: Save state for tomorrow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f data/driveindex.sqlite ] || { echo "no database to save"; exit 0; }
          gzip -c data/driveindex.sqlite > /tmp/driveindex.sqlite.gz
          # Resume markers: small, and the only reason crawlers do not re-walk from the start.
          # data/cron.lock is excluded on purpose — a PID from this runner is meaningless tomorrow.
          tar -czf /tmp/crawler-state.tar.gz $(find samples -name '*.state.json') data/fx-rates.json
          ASSETS="/tmp/driveindex.sqlite.gz /tmp/crawler-state.tar.gz"
          # Only harvest files that a crawler reads back are stored. The rest were deltas and are
          # already folded into the database.
          if [ -f samples/scraped/bat-partitioned.json ]; then
            gzip -c samples/scraped/bat-partitioned.json > /tmp/bat-partitioned.json.gz
            ASSETS="$ASSETS /tmp/bat-partitioned.json.gz"
          fi
          if [ -f samples/scraped/cars-and-bids.json ]; then
            gzip -c samples/scraped/cars-and-bids.json > /tmp/cars-and-bids.json.gz
            ASSETS="$ASSETS /tmp/cars-and-bids.json.gz"
          fi
          if [ -f samples/scraped/barrettjackson.json ]; then
            gzip -c samples/scraped/barrettjackson.json > /tmp/barrettjackson.json.gz
            ASSETS="$ASSETS /tmp/barrettjackson.json.gz"
          fi
          if [ -f samples/scraped/hagerty.json ]; then
            gzip -c samples/scraped/hagerty.json > /tmp/hagerty.json.gz
            ASSETS="$ASSETS /tmp/hagerty.json.gz"
          fi
          if [ -f samples/listings/hagerty-listings.json ]; then
            gzip -c samples/listings/hagerty-listings.json > /tmp/hagerty-listings.json.gz
            ASSETS="$ASSETS /tmp/hagerty-listings.json.gz"
          fi
          gh release view state >/dev/null 2>&1 || \
            gh release create state --title "Pipeline state (internal)" \
              --notes "Working database, crawler resume markers, and the harvest files crawlers read back. Consumed by the pipeline workflows - not a download for humans."
          gh release upload state $ASSETS --clobber
          ls -la /tmp/*.gz

      # NO REDEPLOY STEP, deliberately. Under the file-snapshot model the API had to be rebuilt to
      # pick up new data. Reading from Turso, it does not: the rows change and the very next
      # request sees them. Nothing to trigger, nothing to go stale, one less secret to hold.

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/build.log
            /tmp/harvest-summary.log
            /tmp/pipeline-run-manifest.txt
            data/cron-history.jsonl
          if-no-files-found: ignore
          retention-days: 30
